# pubspec.yaml

name: iokt
description: "Decentralized offline-first avatar creation and social media app for kids"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Core UI & State
  provider: ^6.1.1              # Simple, effective state management
  google_fonts: ^8.2.0          # For modern typography
  shared_preferences: ^2.5.2
  path_provider: ^2.1.3

  # Hardware & Tracking
  camera: ^0.12.0+2
  google_mlkit_face_detection: ^0.14.0  # The offline MediaPipe wrapper
  ffi: ^2.1.0

  # Security & Hardware
  local_auth: ^3.0.2
  vector_math: ^2.1.4
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/avatar/            # Where our 2D Paperdoll avatars will live
